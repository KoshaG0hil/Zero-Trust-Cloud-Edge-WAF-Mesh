# Zero-Trust Edge Bot Detection and Threat Intelligence Signatures
version: "2026.1"

bad_user_agents:
  - "(?i)sqlmap"
  - "(?i)nikto"
  - "(?i)nmap"
  - "(?i)masscan"
  - "(?i)zgrab"
  - "(?i)gobuster"
  - "(?i)dirbuster"
  - "(?i)wpscan"
  - "(?i)scrapy"
  - "(?i)python-requests/(?!\\d)"
  - "(?i)curl/(?:7\\.[0-5]|6\\.)"

verified_search_bots:
  - user_agent_pattern: "(?i)Googlebot"
    asn_allowlist: [15169]
  - user_agent_pattern: "(?i)bingbot"
    asn_allowlist: [8075]

headless_browser_indicators:
  - header: "User-Agent"
    pattern: "(?i)(HeadlessChrome|PhantomJS|Puppeteer|Playwright)"
  - header: "Sec-Ch-Ua"
    pattern: "(?i)Not.A.Brand"

honeypot_endpoints:
  - "/api/v1/internal/admin_debug"
  - "/.git/config"
  - "/wp-login.php"
  - "/actuator/health"
  - "/aws-credentials"
